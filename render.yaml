# Render.com Blueprint - Supabase Backend
# PostgreSQL database on Supabase, backend on Render

services:
  - type: web
    name: hackathon-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        # ⚠️ THAY THỂ BẰNG SUPABASE DATABASE URL CỦA BẠN
        # Format: postgres://postgres:[password]@db.[project].supabase.co:5432/postgres
        value: postgres://postgres:trannguyenphu125@db.bhufnlndpxfcjagzmjrs.supabase.co:5432/postgres
      - key: ALLOWED_ORIGINS
        # ⚠️ THAY THỂ BẰNG URL NETLIFY CỦA BẠN SAU KHI DEPLOY FRONTEND
        value: https://YOUR_NETLIFY_SITE.netlify.app,http://localhost:5173
      - key: ENVIRONMENT
        value: production
