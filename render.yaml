# Render.com Blueprint - Free tier (NO PERSISTENT DISK)
# Warning: Database will be reset on every deploy/restart
# Use Railway.app instead for persistent storage

services:
  - type: pserv
    name: hackathon-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_PATH
        value: ./hackathon-game.db
      - key: ALLOWED_ORIGINS
        value: https://YOUR_NETLIFY_SITE.netlify.app,http://localhost:5173
      - key: ENVIRONMENT
        value: production
